name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test, doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gsim-py's test binary links libpython directly (see below), so the
      # interpreter has to be on the runner before cargo builds it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # gsim-py is handled separately below. `--all-targets` includes test
      # binaries, and with its default features that crate cannot link one.
      - name: cargo clippy
        run: cargo clippy --workspace --exclude gsim-py --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --exclude gsim-py

      # gsim-py is a PyO3 `extension-module` cdylib: it deliberately does not
      # link libpython, because the interpreter supplies those symbols when it
      # dlopen's the module. A test binary is not loaded by an interpreter, so
      # building one with the default features fails at link time with a wall
      # of `undefined symbol: Py*`.
      #
      # Its own Cargo.toml states the intended answer — build this one crate
      # with `--no-default-features` to get a real libpython-linked test
      # binary — so it is tested that way rather than skipped.
      - name: cargo clippy + test (gsim-py, libpython-linked)
        run: |
          cargo clippy -p gsim-py --all-targets --no-default-features -- -D warnings
          cargo test -p gsim-py --no-default-features

      - name: cargo doc
        run: cargo doc --workspace --no-deps

  python-bindings:
    name: gsim-py (maturin build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # gsim-py is a PyO3 extension, not an ordinary cargo target: `cargo
      # test` never builds it, so a change that breaks the binding passes the
      # Rust job and only fails when somebody tries to import it.
      - name: Install maturin
        run: pip install maturin

      - name: Build the wheel
        working-directory: crates/gsim-py
        run: maturin build --release

      - name: Import it
        run: |
          pip install --find-links target/wheels gsim_py
          python -c "import gsim_py; print('gsim_py imports')"

  # Nothing ran `examples/` until this job existed, and they are not illustrative snippets:
  # each `.py` builds a document, emits a netlist, and writes it next to itself, with the
  # committed `.cir` as the golden file. So the library can be renamed out from under all ten
  # of them and every other job stays green.
  #
  # That is not hypothetical. gsim-core#60 renamed two component ids that four examples spell;
  # the renames were verified by running the examples by hand and diffing the netlists,
  # because no job did it. This is that check, so the next rename does not depend on somebody
  # remembering.
  #
  # The solver is not available here, so the examples compile and emit but do not run:
  # `GSIM_SIMULATOR` is left unset and each example says "compiled only, not run" and exits
  # clean. Emission is the part this repository owns.
  examples-still-emit-what-they-emitted:
    name: The examples emit the netlists they committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install gsim_py
        run: |
          pip install maturin
          maturin build --release --manifest-path crates/gsim-py/Cargo.toml --out dist
          pip install --find-links dist gsim_py

      # Run from `examples/` and without `-I`: `h_bridge_3phase_driven.py` imports a sibling
      # module, and isolated mode drops the script's own directory from `sys.path`, which
      # fails the import and looks exactly like a broken example.
      - name: Run every example
        working-directory: examples
        run: |
          failed=0
          for f in *.py; do
            echo "::group::$f"
            if python "$f"; then echo "ok: $f"; else echo "FAILED: $f"; failed=1; fi
            echo "::endgroup::"
          done
          exit $failed

      # The examples rewrite their own `.cir` in place, so an unchanged tree means every
      # netlist still matches the one committed. A diff here is the library having changed
      # under an example without the example being updated.
      - name: The emitted netlists match the committed ones
        run: |
          if ! git diff --exit-code -- examples/; then
            echo "::error::An example emitted a netlist that differs from its committed .cir."
            exit 1
          fi

  # The rating vocabulary lives in two repositories by necessity: `general-simulator`
  # interprets `i_max` and this crate emits it, and neither depends on the other (the engine
  # would gain a compiler it does not need; this crate would gain a solver). So the agreement
  # is checked rather than assumed — a field added on one side and not the other is a limit a
  # user writes in the editor and the engine then refuses, which is the exact failure the
  # capabilities manifest exists to make impossible.
  #
  # Reads the engine's default branch, so it goes red here when the engine changes, which is
  # when somebody can still act on it.
  rating-vocabulary-drift:
    name: The rating vocabulary matches the engine's
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare both RATING_FIELDS lists
        run: |
          set -euo pipefail
          fields() {
            # The names inside the `RATING_FIELDS` array literal, one per line, sorted. Both
            # files spell it the same way, so one extractor serves both.
            sed -n '/RATING_FIELDS: &\[&str\] = &\[/,/^\];/p' "$1" \
              | grep -o '"[a-z_]*"' | tr -d '"' | sort
          }
          curl -fsSL -o engine-rules.rs \
            https://raw.githubusercontent.com/GLODI-Engineering/general-simulator/master/crates/general-simulator-cli/src/rules.rs
          fields engine-rules.rs > engine.txt
          fields crates/gsim-core/src/compile/spec.rs > ours.txt
          test -s engine.txt || { echo "could not read the engine's RATING_FIELDS"; exit 1; }
          if ! diff -u engine.txt ours.txt; then
            echo
            echo "The engine's rating fields and this crate's have drifted."
            echo "Update compile::spec::RATING_FIELDS (and RATING_LIMITS, and the"
            echo "capabilities manifest's closed sets) to match the engine."
            exit 1
          fi
          echo "Both lists: $(tr '\n' ' ' < ours.txt)"

  # The editor owns how a component is *described* -- `block-metadata.schema.json` in
  # omni-schematics -- while this repository owns which components exist. Its catalogue
  # generator refuses to write a catalogue containing a component that fails that contract, so a
  # bad declaration here has twice surfaced over there instead: in a repository that cannot fix
  # it, as a message about JSON Schema keywords, on an unrelated pull request.
  #
  # This validates the same bytes against the same schema, here. Two details make it the real
  # check rather than an approximation of one:
  #
  #   * it validates `catalog()`'s output, not `component-library.json`, because that is what
  #     the editor consumes and the two genuinely differ -- derived fields are added and absent
  #     optionals are dropped. Validating the raw file reports failures the editor never sees.
  #   * the schema is fetched from omni-schematics' default branch rather than copied, for the
  #     same reason `rating-vocabulary-drift` above fetches the engine's own list: a copy of
  #     someone else's contract is a second thing to keep in step, and the fields nobody thought
  #     to copy are exactly the ones that broke.
  #
  # Verified both ways before being committed: against a build carrying the defect it reports
  # `1 of 240`, naming the component and the field, and against the fix, `all 240`.
  library-matches-the-editor-contract:
    name: Every component satisfies the block-metadata contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build gsim_py and dump the catalogue
        run: |
          python -m pip install --upgrade maturin
          maturin build --release --manifest-path crates/gsim-py/Cargo.toml --out wheels
          python -m pip install wheels/gsim_py-*.whl
          python -c "import gsim_py; open('catalog.json', 'w').write(gsim_py.catalog())"

      - name: Fetch the contract and validate every component
        run: |
          set -euo pipefail
          curl -fsSL -o schema.json \
            https://raw.githubusercontent.com/GLODI-Engineering/omni-schematics/main/packages/schemas/definitions/blocks/block-metadata.schema.json
          test -s schema.json || { echo "could not read the editor's block-metadata schema"; exit 1; }
          npm install --no-save --silent ajv@8.17.1
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import Ajv from 'ajv/dist/2020.js'

          const schema = JSON.parse(readFileSync('schema.json', 'utf8'))
          const catalog = JSON.parse(readFileSync('catalog.json', 'utf8'))
          // The same options the editor's own generator compiles this schema with, so a
          // disagreement here is about the data and never about how it was read.
          const validate = new Ajv({ strict: false, allErrors: true }).compile(schema)

          // The contract describes the metadata the editor *builds*, not the catalogue row
          // verbatim: `toCatalogEntries` in omni-schematics' scripts/gen-engine-catalog.mjs
          // drops `id`/`compilable`/`compiles_to` and adds `name`/`engineId`/`engineType`.
          // Validating the row as-is reports "must NOT have additional properties" for most of
          // the library -- failures the editor never sees. Mirrored here rather than copied
          // wholesale, because it is six lines and the schema is the part worth not copying.
          const asEditorMetadata = (component) => {
            const { id, compilable, compiles_to: compilesTo, ...rest } = component
            return {
              ...rest,
              name: rest.name ?? id,
              engineId: id,
              engineType: compilesTo ?? null,
              compilable: compilable ?? true,
            }
          }

          const broken = []
          for (const component of catalog.components) {
            if (validate(asEditorMetadata(component))) continue
            const why = (validate.errors ?? [])
              .slice(0, 4)
              .map((e) => `${e.instancePath || '/'} ${e.message}`)
              .join('; ')
            broken.push(`  ${component.id}: ${why}`)
          }
          if (broken.length) {
            console.error(`${broken.length} of ${catalog.components.length} components do not satisfy the contract:`)
            console.error(broken.join('\n'))
            console.error('')
            console.error('The editor owns how a component is described. Fix the declaration in')
            console.error('crates/gsim-core/data/component-library.json, or widen the schema in')
            console.error('omni-schematics if the contract itself should.')
            process.exit(1)
          }
          console.log(`all ${catalog.components.length} components satisfy the contract`)
          NODE
