name: wheels

# `gsim_py` is the compiled half of the Python story: `gsim_tools.schematic`
# needs it from the moment a Schematic is constructed, because the document
# model and the compile registry live here rather than in Python. Without
# wheels, every user needs a Rust toolchain, so building them is what makes
# `pip install` a realistic instruction.
#
# Runs on a tag, and on demand. Not on every push: a full matrix is minutes of
# runner time and nothing downstream consumes an untagged wheel.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform.target }} on ${{ matrix.platform.runner }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
          # `macos-latest` rather than a pinned `macos-14`: that label resolved
          # to 'macos-14-arm64-us-default', which this organisation's runner
          # allowance does not include, and the job failed in 2s before doing
          # any work. `macos-latest` has been arm64 since macos-14.
          - runner: macos-latest
            target: aarch64
          # Intel macOS is built *on the arm runner*, not on an Intel one.
          # `macos-13` is never assigned a runner for this account: the job sits
          # queued for exactly 24 hours and GitHub cancels it on the queue
          # timeout, taking the whole run and `collect` with it. Three runs,
          # queued -> cancelled to the second: 42632760681 14:14:40Z ->
          # 14:14:40Z next day, 42579600051 07:28:52Z -> 07:28:52Z,
          # 42576322978 06:58:15Z -> 06:58:16Z. That is a label nobody serves,
          # not a busy queue, so waiting for it is waiting for nothing.
          #
          # Cross-compiling is safe here because a PyO3 extension module on
          # macOS resolves its Python symbols with `-undefined dynamic_lookup`,
          # so there is no libpython of the wrong architecture to link against,
          # and Apple's SDK carries both architectures.
          - runner: macos-latest
            target: x86_64-apple-darwin
          # Candidate for the same slot, kept only until a dispatch run shows
          # which of the two actually produces an installable Intel wheel.
          - runner: macos-latest
            target: universal2-apple-darwin
          - runner: windows-2022
            target: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # `--find-interpreter` builds one wheel per CPython on the runner.
          # On Linux the build happens in a manylinux container, so the wheel
          # works on distributions older than the runner's own.
          args: --release --out dist --find-interpreter --manifest-path crates/gsim-py/Cargo.toml
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/gsim-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # Deliberately not a publish step. Pushing to an index needs a token this
  # repository does not have, and publishing is a decision rather than a
  # consequence of tagging. The artifacts above are what a release attaches.
  collect:
    needs: [build, sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: what was built
        run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: all-wheels
          path: dist
