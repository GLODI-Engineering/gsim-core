name: wheels

# `gsim_py` is the compiled half of the Python story: `gsim_tools.schematic`
# needs it from the moment a Schematic is constructed, because the document
# model and the compile registry live here rather than in Python. Without
# wheels, every user needs a Rust toolchain, so building them is what makes
# `pip install` a realistic instruction.
#
# Runs on a tag, and on demand. Not on every push: a full matrix is minutes of
# runner time and nothing downstream consumes an untagged wheel.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform.target }} on ${{ matrix.platform.runner }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
          # `macos-latest` rather than a pinned `macos-14`: that label resolved
          # to 'macos-14-arm64-us-default', which this organisation's runner
          # allowance does not include, and the job failed in 2s before doing
          # any work. `macos-latest` has been arm64 since macos-14.
          - runner: macos-latest
            target: aarch64
          # Intel macOS is built *on the arm runner*, not on an Intel one.
          # `macos-13` is never assigned a runner for this account: the job sits
          # queued for exactly 24 hours and GitHub cancels it on the queue
          # timeout, taking the whole run and `collect` with it. Three runs,
          # queued -> cancelled to the second: 42632760681 14:14:40Z ->
          # 14:14:40Z next day, 42579600051 07:28:52Z -> 07:28:52Z,
          # 42576322978 06:58:15Z -> 06:58:16Z. That is a label nobody serves,
          # not a busy queue, so waiting for it is waiting for nothing.
          #
          # Cross-compiling is safe here because a PyO3 extension module on
          # macOS resolves its Python symbols with `-undefined dynamic_lookup`,
          # so there is no libpython of the wrong architecture to link against,
          # and Apple's SDK carries both architectures.
          #
          # Dispatch run 42832549171 built both this and a `universal2` fat
          # wheel successfully. This one wins: `file` on the extension inside
          # reports `Mach-O 64-bit x86_64`, so the tag is not a mislabelled arm
          # build, it is half the size (3.7 MB against 7.3 MB), and one wheel
          # per architecture matches what Linux and Windows already ship. The
          # fat wheel's arm half would only duplicate the arm64 job above.
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: windows-2022
            target: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # `--find-interpreter` builds one wheel per CPython on the runner.
          # On Linux the build happens in a manylinux container, so the wheel
          # works on distributions older than the runner's own.
          args: --release --out dist --find-interpreter --manifest-path crates/gsim-py/Cargo.toml
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/gsim-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # Deliberately not a *publish* step. Pushing to an index needs a token this
  # repository does not have, and publishing to PyPI is a decision rather than a
  # consequence of tagging.
  #
  # Attaching to the release for the tag that built them is a different thing,
  # and this job used to stop short of it: the comment here claimed "the
  # artifacts above are what a release attaches", and nothing attached them.
  # v0.5.0 built wheels for five platforms, succeeded, and shipped zero release
  # assets. A CI artifact expires and cannot be fetched without a GitHub login
  # and a run id, so for anyone outside CI `gsim_py` was unobtainable without a
  # Rust toolchain -- which is the whole problem wheels exist to solve (#71).
  collect:
    needs: [build, sdist]
    runs-on: ubuntu-24.04
    permissions:
      # Scoped to this job: the only write it performs is the release upload below.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: what was built
        run: ls -la dist

      # A matrix leg that silently stops producing wheels is invisible otherwise:
      # `download-artifact` is happy with whatever showed up, and the release
      # would simply be missing a platform nobody notices until someone on it
      # tries to install. Naming the five expected tags turns that into a failure.
      - name: Every platform in the matrix produced a wheel
        run: |
          missing=0
          for tag in "manylinux*_x86_64" "manylinux*_aarch64" \
                     "macosx_*_arm64" "macosx_*_x86_64" "win_amd64"; do
            # shellcheck disable=SC2086
            if ! ls dist/*-$tag.whl >/dev/null 2>&1; then
              echo "::error::no wheel for $tag"
              missing=1
            fi
          done
          test -n "$(ls -1 dist/*.tar.gz 2>/dev/null)" || {
            echo "::error::no sdist"; missing=1; }
          exit $missing

      - uses: actions/upload-artifact@v4
        with:
          name: all-wheels
          path: dist

      - name: Attach them to the release for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --clobber so re-running the workflow on an existing tag replaces the
          # assets instead of failing on a name that is already there.
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
