[package]
name = "gsim-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PyO3 bindings exposing gsim-core to Python. Intended to become the implementation behind (and a drop-in successor for) general-simulator-gui's existing packages/gsim-model."

[lib]
name = "gsim_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
gsim-core = { path = "../gsim-core" }
pyo3 = { version = "0.29", features = ["extension-module"] }
