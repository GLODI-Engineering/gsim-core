[package]
name = "gsim-py"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PyO3 bindings exposing gsim-core to Python. Intended to become the implementation behind (and a drop-in successor for) general-simulator-gui's existing packages/gsim-model."

[lib]
name = "gsim_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
gsim-core = { path = "../gsim-core" }
# `extension-module` avoids linking against libpython (the symbols are provided at runtime by
# whatever Python interpreter dlopen's this as a module, e.g. via `maturin develop`) -- which is
# exactly what a real `.so` extension module needs, but also exactly what makes `cargo test`'s own
# test binary fail to link, since *it* is not loaded by a Python interpreter and needs those
# symbols resolved directly. Made optional and included in `default` so `cargo build`/`maturin`
# keep working unchanged; `cargo test` (see `AGENTS.md`'s "mechanical gates") is run with
# `--no-default-features` for this one crate to get a real libpython-linked test binary instead.
pyo3 = { version = "0.29" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# `auto-initialize` lets `#[test]`s call `Python::attach` (needed to read a `PyErr`'s message
# through the GIL) without a real embedding host initializing the interpreter first -- Cargo
# unifies this feature into the `pyo3` dependency for test builds only, it plays no part in the
# `extension-module` build `maturin`/`cargo build` produce.
pyo3 = { version = "0.29", features = ["auto-initialize"] }

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
