[package]
name = "gsim-wasm"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "wasm-bindgen bindings exposing gsim-core to general-simulator-gui's frontend."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gsim-core = { path = "../gsim-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
