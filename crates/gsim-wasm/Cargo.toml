[package]
name = "gsim-wasm"
version = "0.5.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "wasm-bindgen bindings exposing gsim-core to general-simulator-gui's frontend."
keywords = ["wasm", "webassembly", "schematic", "circuit-simulation", "electronics"]
categories = ["science", "simulation", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gsim-core = { path = "../gsim-core", version = "0.5.0" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
