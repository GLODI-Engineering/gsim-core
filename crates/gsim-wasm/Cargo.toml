[package]
name = "gsim-wasm"
version = "0.6.3"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "wasm-bindgen bindings exposing gsim-core to a browser or Node front end."
keywords = ["wasm", "webassembly", "schematic", "circuit-simulation", "electronics"]
categories = ["science", "simulation", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gsim-core = { path = "../gsim-core", version = "0.6.3" }
wasm-bindgen = "0.2"
# Used only under `#[cfg(target_arch = "wasm32")]` (see `src/lib.rs`), so a host-target
# `cargo clippy` reports it unused. Removing it breaks the wasm32 build.
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
