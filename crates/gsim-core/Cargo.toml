[package]
name = "gsim-core"
version = "0.6.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Schematic model for circuit and block-diagram simulation: a parametric component-contract schema (GSF v2) whose ports, geometry and validation are expressions evaluated live as parameters change, a .gsim_sch document/builder with .SUBCKT scoping, collision-avoiding autolayout, and netlist compilation — one Rust implementation shared by the gsim-py and gsim-wasm bindings instead of parallel Python and TypeScript copies."
readme = "../../README.md"
keywords = ["schematic", "netlist", "circuit-simulation", "autolayout", "electronics"]
categories = ["science", "simulation"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
regex = "1"

[dev-dependencies]
